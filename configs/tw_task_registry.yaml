schema_version: tw.task.registry.v1
run_record_schema: tw.task.run.v1
tasks:
  daily_update:
    executor_id: daily_update_v1
    description: Run the existing daily data and model orchestration through validated parameters.
    defaults:
      asof: auto
      model_track_ids:
        - model_a_only
        - model_a_plus_b_b19r2r
      finmind_scope: full
      force: false
      skip_finmind: false
      skip_qlib: false
      max_workers: 4
      stage_timeout_seconds: 1800
      overall_timeout_seconds: 14400
    parameter_schema:
      type: object
      additionalProperties: false
      properties:
        asof:
          type: string
          pattern: '^(auto|[0-9]{4}-[0-9]{2}-[0-9]{2})$'
        model_track_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9_.-]*$'
        finmind_scope:
          enum: [daily, full]
        force:
          type: boolean
        skip_finmind:
          type: boolean
        skip_qlib:
          type: boolean
        max_workers:
          type: integer
          minimum: 1
          maximum: 16
        stage_timeout_seconds:
          type: integer
          minimum: 60
          maximum: 7200
        overall_timeout_seconds:
          type: integer
          minimum: 600
          maximum: 21600
    bindings:
      runner: scripts/run_daily_tw_stock_auto_update.py
      model_track_governance: configs/readonly_model_tracks.yaml
      model_track_runtime: configs/daily_model_tracks.yaml

  readonly_backtest:
    executor_id: readonly_backtest_v1
    description: Build an isolated readonly ReplayResult candidate from registered model, strategy, and window inputs.
    defaults:
      timeout_seconds: 1200
    parameter_schema:
      type: object
      additionalProperties: false
      required:
        - model_track_id
        - strategy_rule
        - start_date
        - end_date
      properties:
        model_track_id:
          type: string
          pattern: '^[a-z][a-z0-9_.-]*$'
        strategy_rule:
          type: string
          pattern: '^[a-z][a-z0-9_.-]*$'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timeout_seconds:
          type: integer
          minimum: 60
          maximum: 7200
    bindings:
      runner: scripts/build_tw_readonly_replay_window_artifact.py
      model_tracks: configs/readonly_model_tracks.yaml
      replay_policy: configs/tw_replay_window_policy.yaml
      modular_registry: configs/tw_modular_registry.yaml
      baseline_descriptor: configs/active_baseline_descriptor.yaml
      baseline_manifest: data_tw/experiments/extended_oos_qlib_orthogonal_ltr/modular_replay_matrix/formal_replay_manifest.json
      price_store_manifest: data_tw/canonical/price_store/tw_equity_daily/dng2_r_price_market_calendar_20260625/manifest.json

  readonly_model_comparison:
    executor_id: workflow_spec_v1
    description: Run the registered readonly dual-model comparison DAG with the shared workflow engine.
    defaults: {}
    parameter_schema:
      type: object
      additionalProperties: false
      required:
        - asof
        - decision_cutoff
      properties:
        asof:
          type: string
          format: date
        decision_cutoff:
          type: string
          format: date-time
    bindings:
      workflow_spec: configs/workflows/readonly_dual_model_track_comparison.yaml
      mode: readonly
      permissions:
        - artifact.read
        - readonly.comparison.write
