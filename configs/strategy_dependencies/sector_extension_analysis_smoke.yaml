strategy_rule: sector_extension_analysis_smoke
dependency_version: strategy_dependency_v1
applies_to_artifact_names:
  - fresh_qlib_adaptive_sector_extension_smoke
required_core_fields:
  - date
  - instrument
  - candidate_rank
  - buy_score
  - signal_asof
  - available_at
required_capabilities:
  - core_signal_v1
  - candidate_boundary:qlib_top50
  - supports_sector_exposure
required_extensions:
  - field: ext_sector_code
    semantic_role: sector_code
    usage: sector_analysis_smoke
optional_extensions: []
ranking_usage:
  - field: buy_score
    usage: buy_ordering
forbidden_fields:
  - future_return_*
  - future_excess_return_*
  - forward_return_*
  - label_*
  - realized_pnl
  - realized_return
  - action
  - holding
  - position
  - target_position
  - order_qty
  - execution_price
  - execution_date
  - broker_order_id
max_buy_count: diagnostic_only
max_sell_count: diagnostic_only
diagnostic_only: false
not_valid_strategy_evidence: false
forbidden_actions:
  no_training: true
  no_tuning: true
  no_score_recompute: true
  no_replay: true
  no_return_filtering: true
  no_default_strategy_change: true
  no_frontend_change: true
  no_daily_orchestrator_change: true
  no_provider_publish: true
  no_accepted_latest_switch: true
  no_monitor: true
  no_broker_order: true
