strategy_rule: top50_hold_rank_buffer_100
dependency_version: strategy_dependency_v1

readonly_only: true
simulation_only: true
diagnostic_only: false
research_only: false
production_allowed: false
production_candidate: true
frontend_selectable: false
production_default: false
not_order: true
not_target_position: true
not_investment_advice: true

candidate_source_mechanism: M2_hold_rank_buffer_100
parent_research_strategy_rule: mechanism_transfer_top50_cost_aware_v1
production_candidate_phase: MTRP0_P2

required_core_fields:
  - date
  - instrument
  - model_name
  - model_family
  - candidate_rank
  - buy_score
  - raw_score
  - score_rank
  - full_qlib_rank
  - signal_asof
  - available_at
  - source_artifact

required_capabilities:
  - core_signal_v1
  - candidate_boundary:qlib_top50
  - buy_ordering:buy_score_desc
  - full_rank_exit:full_qlib_rank
  - full_rank_visibility:hold_rank_buffer_100
  - pit_available_at_checked

optional_extensions: []
required_extensions: []

required_signal_visibility:
  candidate_k: 50
  hold_rank_buffer: 100
  minimum_full_qlib_rank_visible: 100
  non_top50_visibility_required: true
  holding_visibility_required: true
  stop_if_only_top50_visible: true
  stop_verdict: STOP_PRODUCTION_SIGNAL_FULL_RANK_VISIBILITY_MISSING

ranking_usage:
  - field: candidate_rank
    usage: buy_candidate_boundary_candidate_rank_lte_50
  - field: buy_score
    usage: buy_ordering_desc
  - field: full_qlib_rank
    usage: sell_boundary_and_worst_visible_holding
  - field: instrument
    usage: stable_tie_breaker_asc

required_portfolio_state_fields:
  - asof_date
  - instrument
  - quantity
  - cost_basis
  - current_holding_flag

max_buy_count: 1
max_sell_count: 1
target_holding_count: 10
candidate_k: 50
hold_rank_buffer: 100
sell_boundary: full_qlib_rank_gt_100
buy_order: buy_score_desc_full_qlib_rank_asc_instrument_asc
tie_breaker:
  - full_qlib_rank_asc
  - instrument_asc

rule_semantics:
  buy:
    eligible_universe: candidate_rank_lte_50
    current_holding_flag_required: false
    order:
      - buy_score_desc
      - full_qlib_rank_asc
      - instrument_asc
    max_count: 1
  sell:
    eligible_universe: current_holdings_only
    trigger: full_qlib_rank_gt_100
    missing_rank_policy: stop_or_skip_with_audit
    order:
      - full_qlib_rank_desc
      - instrument_asc
    max_count: 1
  missing_holding_visibility_policy:
    verdict: STOP_OR_SKIP_NO_ASSUMED_VISIBILITY
    rule: do_not_assume_holding_still_visible_when_rank_absent

forbidden_fields:
  - future_return_*
  - future_excess_return_*
  - forward_return_*
  - label_*
  - relevance_10d_top_heavy
  - ltr_relevance_label
  - realized_pnl
  - realized_return
  - replay_return
  - execution_price
  - execution_date
  - execution_quantity
  - next_open
  - next_close
  - broker_order_id
  - broker
  - order_id
  - quick_trade
  - target_position
  - target_weight
  - allocation_weight
  - cash
  - cash_after
  - nav
  - equity
  - daily_return
  - commission
  - fee
  - tax

forbidden_order_intent_fields:
  - execution_date
  - execution_price
  - execution_quantity
  - quantity_to_buy
  - quantity_to_sell
  - shares
  - lots
  - target_position
  - target_weight
  - allocation_weight
  - commission
  - fee
  - tax
  - cash
  - cash_after
  - nav
  - equity
  - daily_return
  - realized_pnl
  - unrealized_pnl
  - replay_return
  - broker
  - broker_order_id
  - order_id
  - quick_trade

forbidden_actions:
  - train_model
  - tune_model
  - score_recompute
  - read_model_private_file
  - read_mtrc_private_signal_csv
  - read_replay_return_as_input
  - read_future_price
  - read_future_label
  - write_broker_order
  - quick_trade
  - provider_publish
  - accepted_latest_switch
  - frontend_default_switch
  - api_default_switch
  - agent_default_switch
  - daily_auto_latest_pointer_switch
  - monitor_scan_or_alert
  - formal_pricestore_write
  - output_target_weight_or_position
  - output_real_order_or_quantity

allowed_outputs:
  - readiness_artifact
  - stop_artifact
  - order_intent_artifact_after_readiness_pass
  - validator_report
  - execution_report
