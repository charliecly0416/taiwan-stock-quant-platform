schema_version: tw.workflow.spec.v1
workflow_id: readonly.dual_model_track_comparison
version: "3"
nodes:
  - id: model_a
    module: readonly_model_track.model_a_only
    policy: required
    config:
      track_id: model_a_only
  - id: model_a_plus_b
    module: readonly_model_track.model_a_plus_b_b19r2r
    policy: nonblocking
    config:
      track_id: model_a_plus_b_b19r2r
  - id: model_a_catalog
    module: readonly_model_track.catalog
    needs:
      - model_a
    policy: required
    config:
      track_ids:
        - model_a_only
  - id: comparison
    module: readonly_model_track.compare
    needs:
      - model_a
      - model_a_plus_b
      - model_a_catalog
    policy: nonblocking
    config:
      track_ids:
        - model_a_only
        - model_a_plus_b_b19r2r
