    original:
      dependency_path: configs/strategy_dependencies/original.yaml
      reason: deprecated origin/original baseline; not frontend/API selectable
    origin:
      reason: alias of original; not frontend/API selectable
    top50_exit_all:
      dependency_path: configs/strategy_dependencies/top50_exit_all.yaml
