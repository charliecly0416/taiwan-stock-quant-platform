name: Backend TWStock Research Stack

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/app/routes/tw_stock.py'
      - 'backend/app/services/tw_stock*.py'
      - 'backend/app/data_sources/tw_stock.py'
      - 'backend/scripts/*tw_stock*'
      - 'backend/tests/test_tw_stock*'
      - 'backend/tests/test_*tw_stock*'
      - 'docs/TW_STOCK*'
      - 'docs/TAIWAN_STOCK*'
      - '.github/workflows/backend-tw-stock-research.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/app/routes/tw_stock.py'
      - 'backend/app/services/tw_stock*.py'
      - 'backend/app/data_sources/tw_stock.py'
      - 'backend/scripts/*tw_stock*'
      - 'backend/tests/test_tw_stock*'
      - 'backend/tests/test_*tw_stock*'
      - 'docs/TW_STOCK*'
      - 'docs/TAIWAN_STOCK*'
      - '.github/workflows/backend-tw-stock-research.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Read-only TWStock research verification
    runs-on: ubuntu-latest
    env:
      AGENT_LIVE_TRADING_ENABLED: 'false'
      ENABLE_PENDING_ORDER_WORKER: 'false'
      ENABLE_PORTFOLIO_MONITOR: 'false'
      ENABLE_TW_STOCK_MONITOR_WORKER: 'false'
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          grep -v "MetaTrader5" requirements.txt > /tmp/requirements_ci.txt
          pip install -r /tmp/requirements_ci.txt
      - name: Run TWStock research verification
        run: python backend/scripts/verify_tw_stock_research_stack.py
