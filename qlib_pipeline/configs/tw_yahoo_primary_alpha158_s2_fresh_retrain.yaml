qlib_init:
    provider_uri: qlib_pipeline/data_tw/experiments/yahoo_adjusted_primary/option_c_150_qlib_bin
    region: tw
    expression_cache: null
    dataset_cache: null

market: &market tw_liquid_dyn
benchmark: &benchmark TWII

data_handler_config: &data_handler_config
    start_time: 2015-05-04
    end_time: 2026-05-07
    fit_start_time: 2015-05-04
    fit_end_time: 2024-12-31
    instruments: all

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.05
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 4
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2017-01-10, 2024-12-31]
                valid: [2025-01-01, 2025-06-30]
                test: [2025-07-01, 2026-05-07]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
