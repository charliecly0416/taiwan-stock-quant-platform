qlib_init:
  provider_uri: ~/.qlib/qlib_data/tw_data
  region: tw
  expression_cache: null
  dataset_cache: null
market: tw_demo
benchmark: TWII
data_handler_config: &id001
  start_time: 2015-01-01
  end_time: 2026-05-21
  fit_start_time: 2015-01-01
  fit_end_time: 2021-12-31
  instruments: tw_demo
port_analysis_config: &id002
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 30
      n_drop: 1
  backtest:
    start_time: 2024-01-01
    end_time: 2026-05-21
    account: 100000000
    benchmark: TWII
    exchange_kwargs:
      limit_threshold: 0.1
      deal_price: close
      open_cost: 0.001425
      close_cost: 0.004425
      min_cost: 20
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.05
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 8
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: TWAlpha158RetVolOnly
        module_path: qlib.contrib.data.tw_handler
        kwargs: *id001
      segments:
        train:
        - 2015-01-01
        - 2021-12-31
        valid:
        - 2022-01-01
        - 2023-12-31
        test:
        - 2024-01-01
        - 2026-05-21
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
